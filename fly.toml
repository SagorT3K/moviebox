# fly.toml - Fly.io Configuration
# https://fly.io/docs/reference/configuration/

app = 'moviebox-frontend'
primary_region = 'sin'

[build]

[env]
  PORT = '7860'
  NODE_ENV = 'production'

[http_service]
  internal_port = 7860
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
